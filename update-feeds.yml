name: Update split Canvas feeds

on:
  schedule:
    # every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  split-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install icalendar

      - name: Split feed by course
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
        run: |
          python3 split_canvas_feed.py \
            --output-dir docs \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Commit and push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Update split Canvas feeds"
          git push
